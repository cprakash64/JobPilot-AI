# Local development stack.
#
# Production differences that are deliberate here (see docs/DEPLOYMENT.md):
#   * RUN_MIGRATIONS_ON_STARTUP is true for convenience. In production it is
#     false and `alembic upgrade head` runs as one explicit release step, so N
#     replicas do not each race to migrate the same database.
#   * APP_ENV=development keeps the development defaults usable. Setting
#     APP_ENV=production activates app.core.config_validation, which refuses to
#     start with the default SECRET_KEY or the database password below.
#   * The credentials below are development-only defaults and are intentionally
#     public. Never reuse them anywhere real.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://jobpilot:jobpilot_dev_password@postgres:5432/jobpilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
    ports:
      - "8000:8000"
    volumes:
      - generated_files:/app/generated
      - uploaded_files:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Liveness, NOT readiness. Docker restarts a container that fails its
    # healthcheck, so gating this on the database would restart healthy API
    # containers during a database blip. Readiness (/readyz) is for a load
    # balancer, not a restart policy — in Kubernetes use /healthz for
    # livenessProbe and /readyz for readinessProbe.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    command: sh /app/scripts/start-api.sh

  # Background worker: runs post-ingest fit scoring and recurring-ingestion tasks.
  # Separate from the API so scoring never blocks request handling.
  worker:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://jobpilot:jobpilot_dev_password@postgres:5432/jobpilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Explicit: only the API image's start script may migrate, and only in
      # development. A worker that migrates races the API and every other worker.
      RUN_MIGRATIONS_ON_STARTUP: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.tasks.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # SIGTERM lets Celery finish the in-flight task before exiting; the default
    # 10s grace is too short for a scoring batch.
    stop_grace_period: 30s
    command: celery -A app.workers.tasks.celery_app worker --loglevel=info --concurrency=2

  # Beat scheduler: a SINGLE service that triggers recurring ingestion on the
  # configured cron. Never run inside the API (multiple replicas would duplicate
  # runs); the ingestion itself is additionally guarded by a distributed lock.
  scheduler:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://jobpilot:jobpilot_dev_password@postgres:5432/jobpilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RUN_MIGRATIONS_ON_STARTUP: "false"
      JOB_INGESTION_ENABLED: ${JOB_INGESTION_ENABLED:-true}
      JOB_INGESTION_SCHEDULE: ${JOB_INGESTION_SCHEDULE:-0 6 * * *}
      JOB_INGESTION_TIMEZONE: ${JOB_INGESTION_TIMEZONE:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The image's HEALTHCHECK curls /healthz, which only the API serves — beat
    # would be permanently "unhealthy". Beat has no useful liveness endpoint and
    # nothing depends on it being healthy, so the inherited check is disabled
    # rather than faked.
    healthcheck:
      disable: true
    stop_grace_period: 15s
    command: celery -A app.workers.tasks.celery_app beat --loglevel=info

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    # Wait for the API to be serving before starting. No cycle: web -> api ->
    # {postgres, redis}, and nothing depends on web.
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  generated_files:
  uploaded_files:
